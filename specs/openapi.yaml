      summary: Login implícito + obtener documentos
      security:
        - apiKeyAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFilterWithLoginRequest'
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
