openapi: 3.0.3
info:
  title: D3 API Contract (SDD)
  description: >
    Contrato formal compartido entre d3_front (Angular) y d3brain (Spring Boot).
    Fuente de verdad: specs/contract.md.
    Base URL resuelta en runtime por el cliente (ver conf.xml / location.origin).
  version: "2.1.0"
  contact:
    name: D3

servers:
  - url: https://{host}/api
    description: API externa (requiere x-api-key)
    variables:
      host:
        default: backend
  - url: https://{host}/document
    description: API interna SPA (auth + documentos)
    variables:
      host:
        default: backend
  - url: https://{host}
    description: Base SPA (template/user/task/account)
    variables:
      host:
        default: backend

tags:
  - name: auth-internal
    description: Autenticación de la SPA (main)
  - name: api-external
    description: API pública /api

security:
  - bearerAuth: []
  - apiKeyAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión (opaco hoy, JWT HS256 en migración). También aceptado en campo securityToken del body.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key obligatoria en todos los endpoints /api/*

  schemas:
    SharedIdResponse:
      type: object
      properties:
        id:
          type: string
          description: Llave/token de sesión o id de entidad
        code:
          type: string
        state:
          type: string
        comment:
          type: string
        messages:
          type: array
          items:
            type: object
            description: DocumentMessage (ver dominio documentos)

    FieldRequest:
      type: object
      properties:
        field:
          type: string
        value:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRequest'
        parentDocument:
          $ref: '#/components/schemas/DocumentRequest'

    ProductRequest:
      type: object
      description: Definir campos en openapi (pendiente de inspección)
      properties:
        product:
          type: string
      additionalProperties: true

    DocumentRequest:
      type: object
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        active:
          type: string
        stateId:
          type: string
        stateName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'

    DocumentFilterRequest:
      type: object
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        filterText:
          type: string
        states:
          type: array
          items:
            type: string
        active:
          type: string
        page:
          type: integer
        size:
          type: integer
        creationDateMin:
          type: string
          format: date-time
        creationDateMax:
          type: string
          format: date-time
        dateMin:
          type: string
          format: date-time
        dateMax:
          type: string
          format: date-time
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'

    DocumentResponse:
      type: object
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        active:
          type: string
        stateId:
          type: string
        stateName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldResponse'
        fullValue:
          type: number
        pendingValue:
          type: number

    FieldResponse:
      type: object
      description: Definir campos en openapi (pendiente de inspección)
      additionalProperties: true

    ReportRequest:
      type: object
      properties:
        template:
          type: string
        code:
          type: string
        documentId:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ReportParameterRequest'

    ReportParameterRequest:
      type: object
      description: Definir campos en openapi (pendiente de inspección)
      additionalProperties: true

    DataFieldRequest:
      type: object
      properties:
        template:
          type: string
        code:
          type: string
        preconditions:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'

    DataFieldResponse:
      type: object
      description: Definir campos en openapi (pendiente de inspección)
      additionalProperties: true

    LoginRequest:
      type: object
      properties:
        user:
          type: string
        password:
          type: string

    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
          description: id_token de Google
        urlServer:
          type: string

    ApiError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error_code:
          type: string
        message:
          type: string
        detail:
          type: string

    PedidoVentaDTO:
      type: object
      description: Documento/expediente (d3.document_execution.domain)
      additionalProperties: true
      properties:
        llaveTabla:
          type: string
        nombre:
          type: string
        plantilla:
          type: string
        descripcion:
          type: string
        estadoExpediente:
          type: string
        estadoNombre:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true

    PedidoVentaFilterDTO:
      type: object
      additionalProperties: true
      properties:
        llaveTabla:
          type: string
        plantilla:
          type: string
        securityToken:
          type: string

    PedidoVentaAjusteDTO:
      type: object
      description: Transición de estado (d3.document_transition.domain)
      additionalProperties: true

    PedidoVentaCaracteristicaFilterDTO:
      type: object
      additionalProperties: true
      properties:
        campo:
          type: string
        securityToken:
          type: string

    TaskDTO:
      type: object
      description: Tarea (com.task.task.domain)
      additionalProperties: true
      properties:
        key:
          type: string
        user:
          type: string
        title:
          type: string
        notes:
          type: string
        completed:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        priority:
          type: integer
        order:
          type: integer
        createdAt:
          type: string
          format: date-time

    TaskRequest:
      type: object
      description: Solicitud de creación/actualización de tarea
      additionalProperties: true
      properties:
        key:
          type: string
        user:
          type: string
        title:
          type: string
        notes:
          type: string
        completed:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        priority:
          type: integer
        order:
          type: integer

  responses:
    Unauthorized:
      description: Token inválido, expirado o sesión cerrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Error de validación / regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

paths:
  /login:
    post:
      tags: [api-external]
      summary: Login de API (user/password)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /get:
    post:
      tags: [api-external]
      summary: Listar documentos por filtro
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFilterRequest'
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /send:
    post:
      tags: [api-external]
      summary: Crear o actualizar documento
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Resultado de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /getReport:
    post:
      tags: [api-external]
      summary: Generar reporte
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /getWithLogin:
    post:
      tags: [api-external]
      summary: Login implícito + obtener documentos
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  $ref: '#/components/schemas/LoginRequest'
                document:
                  $ref: '#/components/schemas/DocumentFilterRequest'
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'

  /getDataFieldWithLogin:
    post:
      tags: [api-external]
      summary: Login implícito + datos de campo
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  $ref: '#/components/schemas/LoginRequest'
                field:
                  $ref: '#/components/schemas/DataFieldRequest'
      responses:
        '200':
          description: Datos de campo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFieldResponse'

  /sendWithLogin:
    post:
      tags: [api-external]
      summary: Login implícito + enviar documento
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  $ref: '#/components/schemas/LoginRequest'
                document:
                  $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /ok:
    get:
      tags: [api-external]
      summary: Healthcheck autenticado por API key
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: OK

  /ping:
    get:
      tags: [api-external]
      summary: Healthcheck público
      responses:
        '200':
          description: PING

  /main/autenticarUsuarioAutenticacion:
    post:
      tags: [auth-internal]
      summary: Login de la SPA (usuario/clave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sesion:
                  type: string
                  description: usuario
                clave:
                  type: string
                  description: clave
                claveAnterior:
                  type: string
                  description: fecha de compilación (control de versión cliente)
                securityToken:
                  type: string
                usuario:
                  type: string
                  description: llaveTabla (re-login con token)
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuarioDTO:
                    type: object
                    additionalProperties: true
                  organizacion:
                    type: object
                    additionalProperties: true
                  mensaje:
                    type: string
                  fechaMaxima:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /main/googleAuthenticate:
    post:
      tags: [auth-internal]
      summary: Login con Google Sign-In
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Autenticación exitosa (mismo esquema que login normal)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /main/checkToken:
    post:
      tags: [auth-internal]
      summary: Validar token de sesión actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                securityToken:
                  type: string
                claveAnterior:
                  type: string
      responses:
        '200':
          description: Token válido, devuelve perfil
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /main/cambiarClave:
    post:
      tags: [auth-internal]
      summary: Cambiar clave (propia u otro usuario)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Clave actualizada
        '400':
          $ref: '#/components/responses/BadRequest'

  /main/solicitarNuevaClave:
    post:
      tags: [auth-internal]
      summary: Recuperar / solicitar nueva clave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuarioDTO:
                  type: object
                  properties:
                    identificacion:
                      type: string
                    correo:
                      type: string
      responses:
        '200':
          description: Solicitud procesada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /main/obtenerPrincipalOrganizacion:
    get:
      tags: [auth-internal]
      summary: Obtener organización principal (carousel, módulos)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organización
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/guardarDocumento:
    post:
      tags: [documents]
      summary: Crear o editar documento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaDTO'
      responses:
        '200':
          description: Documento resumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoVentaDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/consultarDocumento:
    post:
      tags: [documents]
      summary: Documento completo por llaveTabla
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaFilterDTO'
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoVentaDTO'

  /api/listarDocumentos:
    post:
      tags: [documents]
      summary: Listar documentos con filtros
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaFilterDTO'
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoVentaDTO'

  /api/changeState:
    post:
      tags: [documents]
      summary: Cambiar estado del documento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaAjusteDTO'
      responses:
        '200':
          description: Ajuste guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoVentaAjusteDTO'

  /api/consultarDatosBase:
    post:
      tags: [documents]
      summary: Datos base/dependentes de campo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaCaracteristicaFilterDTO'
      responses:
        '200':
          description: Datos base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoVentaCaracteristicaFilterDTO'

  /api/upload:
    post:
      tags: [documents]
      summary: Subir archivo adjunto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: URL del archivo (en message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /document/getDocuments:
    post:
      tags: [documents]
      summary: Listar documentos (header)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoVentaFilterDTO'
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoVentaDTO'

  /document/getInventory/{id}:
    get:
      tags: [documents]
      summary: Inventario por producto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventario
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /template/getTemplates/{profile}:
    get:
      tags: [documents]
      summary: Plantillas por perfil (ADMIN/READER/usuario)
      security:
        - bearerAuth: []
      parameters:
        - name: profile
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plantillas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /task/:
    get:
      tags: [tasks]
      summary: Listar tareas del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDTO'

  /task/{id}:
    get:
      tags: [tasks]
      summary: Ver tarea por id (id en query param)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDTO'

  /task/create:
    post:
      tags: [tasks]
      summary: Crear tarea
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /task/update:
    post:
      tags: [tasks]
      summary: Actualizar tarea
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /task/delete/{id}:
    post:
      tags: [tasks]
      summary: Eliminar tarea
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tarea eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /acc/voucher/{catalog}:
    get:
      tags: [accounting]
      summary: Listar comprobantes por catálogo
      security: [bearerAuth]
      parameters:
        - name: catalog
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lista de comprobantes
          content:
            application/json:
              schema:
                type: array
                items: { type: object }

  /acc/voucher/manual:
    post:
      tags: [accounting]
      summary: Crear comprobante manual
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Comprobante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /acc/plan/balance/{catalog}:
    get:
      tags: [accounting]
      summary: Saldos del plan contable
      security: [bearerAuth]
      parameters:
        - name: catalog
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema: { type: object }

  /massiveload/template:
    post:
      tags: [massive]
      summary: Descargar plantilla base (xlsx/xml/json)
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId: { type: string }
                format: { type: string, enum: [xlsx, xml, json] }
      responses:
        '200':
          description: URL del archivo generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }

  /massiveload/upload:
    post:
      tags: [massive]
      summary: Cargar archivo de carga masiva
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Carga registrada (loadId)
          content:
            application/json:
              schema: { type: object }

  /massiveload/validate/{loadId}:
    post:
      tags: [massive]
      summary: Validar carga masiva
      security: [bearerAuth]
      parameters:
        - name: loadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Carga validada
          content:
            application/json:
              schema: { type: object }

  /massiveload/execute/{loadId}:
    post:
      tags: [massive]
      summary: Ejecutar/procesar carga masiva
      security: [bearerAuth]
      parameters:
        - name: loadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Carga ejecutada
          content:
            application/json:
              schema: { type: object }

  /massiveload/{loadId}:
    get:
      tags: [massive]
      summary: Obtener carga (detalle/historial)
      security: [bearerAuth]
      parameters:
        - name: loadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Carga
          content:
            application/json:
              schema: { type: object }

  /massiveload/{loadId}/items:
    get:
      tags: [massive]
