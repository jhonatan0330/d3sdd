openapi: 3.0.3
info:
  title: D3 API Contract (SDD)
  description: >
    Contrato formal compartido entre d3_front (Angular) y d3brain (Spring Boot).
    Fuente de verdad: specs/contract.md.
    Base URL resuelta en runtime por el cliente (ver conf.xml / location.origin).
    NOTA: La mayoría de endpoints internos están bajo /document/* (DocumentController).
  version: "2.2.0"
  contact:
    name: D3

servers:
  - url: https://{host}
    description: Backend principal (API + SPA + documentos)
    variables:
      host:
        default: backend

tags:
  - name: auth-internal
    description: Autenticación de la SPA (main) — bajo /document/main/*
  - name: api-external
    description: API pública bajo /api/*
  - name: documents
    description: Gestión de documentos (expedientes/pedidos) — bajo /document/*
  - name: document-transition
    description: Transiciones de estado de documentos
  - name: tasks
    description: Gestión de tareas personales — bajo /task/*
  - name: accounting
    description: Comprobantes y plan contable — bajo /acc/*
  - name: massive
    description: Carga masiva de datos — bajo /massiveload/*
  - name: notifications
    description: Actividades y notificaciones — bajo /notification/*
  - name: config-forms
    description: Configuración de formularios y propiedades — bajo /api/config/*
  - name: persons
    description: Gestión de usuarios — bajo /user/*
  - name: authorization
    description: Roles y doble factor de autenticación
  - name: fe
    description: Facturación electrónica (DIAN) — bajo /fe/*
  - name: upload
    description: Almacenamiento y servicio de archivos — bajo /files/*
  - name: process-designer
    description: Diseñador de procesos/plantillas — bajo /template/*

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Token de sesión opaco (UUID hex de 32 chars) o JWT HS256.
        Viaja en header Authorization. También aceptado como campo
        securityToken en el body de algunos DTOs (BasicFilterDTO).
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key obligatoria en endpoints /api/* (ApiController)
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: >
        ID del tenant requerido por TenantFilter (OncePerRequestFilter).
        Obligatorio en TODOS los endpoints. Rechaza con 404 si falta o es inválido.

  schemas:
    # ==================== SHARED ====================
    SharedIdResponse:
      type: object
      description: Respuesta genérica con ID de entidad operada
      properties:
        id:
          type: string
          description: Llave/token de sesión o id de entidad
        code:
          type: string
        state:
          type: string
        comment:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMessage'

    DocumentMessage:
      type: object
      description: Mensaje asociado a un documento
      properties:
        code:
          type: string
        message:
          type: string
        type:
          type: string

    BasicDTO:
      type: object
      description: >
        Clase base abstracta (d3.shared.domain.BasicDTO).
        Propiedades heredadas por PedidoVentaDTO, ActividadDTO, etc.
      properties:
        llaveTabla:
          type: string
          description: ID principal de la entidad
        estado:
          type: string
          description: Estado de la entidad (A=Activa, I=Inactiva, C=Cerrada)

    BasicFilterDTO:
      type: object
      description: >
        Clase base abstracta para filtros (d3.shared.domain.BasicFilterDTO).
        Propiedades heredadas por PedidoVentaFilterDTO, etc.
      properties:
        paginacionRegistroInicial:
          type: integer
          description: Registro inicial para paginación (offset)
        paginacionRegistroFinal:
          type: integer
          description: Registro final para paginación (limit)
        filtroParametro:
          type: string
        llaveTabla:
          type: string
        estado:
          type: string
        securityToken:
          type: string
          description: Token de sesión (alternativo al header Authorization)

    SharedDataObject:
      type: object
      description: >
        Clase base abstracta (d3.shared.domain.SharedDataObject).
        Propiedades heredadas por TaskDTO, VoucherDTO, MasivaItemRequest.
      properties:
        key:
          type: string
        state:
          type: string

    SharedApiErrorResponse:
      type: object
      description: >
        Error response del backend (d3.shared.domain.SharedApiErrorResponse).
        NOTA: status se serializa como string (HttpStatus.name()), no como integer.
      properties:
        status:
          type: string
          description: "Nombre del HTTP status (ej: INTERNAL_SERVER_ERROR)"
        error_code:
          type: string
        message:
          type: string
        detail:
          type: string

    # ==================== API EXTERNAL (d3.api.domain) ====================
    LoginRequest:
      type: object
      description: Login de API (d3.api.domain.LoginRequest)
      properties:
        user:
          type: string
        password:
          type: string
      required: [user, password]

    FieldRequest:
      type: object
      description: Campo de documento (d3.api.domain.FieldRequest)
      properties:
        field:
          type: string
        value:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRequest'
        parentDocument:
          $ref: '#/components/schemas/DocumentRequest'

    ProductRequest:
      type: object
      description: Producto asociado a un campo (d3.api.domain.ProductRequest)
      properties:
        totalQuantity:
          type: number
          format: double
        totalValue:
          type: number
          format: double
        code:
          type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'

    DocumentRequest:
      type: object
      description: Documento para enviar (d3.api.domain.DocumentRequest)
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        active:
          type: string
        stateId:
          type: string
        stateName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'
      required: [template]

    DocumentFilterRequest:
      type: object
      description: Filtro de documentos (d3.api.domain.DocumentFilterRequest)
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        filterText:
          type: string
        states:
          type: array
          items:
            type: string
        active:
          type: string
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 0
        creationDateMin:
          type: string
          format: date-time
        creationDateMax:
          type: string
          format: date-time
        dateMin:
          type: string
          format: date-time
        dateMax:
          type: string
          format: date-time
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'

    DocumentFilterWithLoginRequest:
      type: object
      description: Login + filtro (d3.api.domain.DocumentFilterWithLoginRequest)
      properties:
        login:
          $ref: '#/components/schemas/LoginRequest'
        document:
          $ref: '#/components/schemas/DocumentFilterRequest'
      required: [login, document]

    DocumentWithLoginRequest:
      type: object
      description: Login + documento (d3.api.domain.DocumentWithLoginRequest)
      properties:
        login:
          $ref: '#/components/schemas/LoginRequest'
        document:
          $ref: '#/components/schemas/DocumentRequest'
      required: [login, document]

    DocumentResponse:
      type: object
      description: Respuesta de documento (d3.api.domain.DocumentResponse)
      properties:
        template:
          type: string
        id:
          type: string
        code:
          type: string
        active:
          type: string
        stateId:
          type: string
        stateName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldResponse'
        fullValue:
          type: number
          format: double
        pendingValue:
          type: number
          format: double
      required: [template, id]

    FieldResponse:
      type: object
      description: Campo de respuesta (d3.api.domain.FieldResponse)
      properties:
        code:
          type: string
        name:
          type: string
        internalId:
          type: string
        value:
          type: string

    ReportRequest:
      type: object
      description: Solicitud de reporte (d3.api.domain.ReportRequest)
      properties:
        template:
          type: string
        code:
          type: string
        documentId:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ReportParameterRequest'
      required: [template, code]

    ReportParameterRequest:
      type: object
      description: Parámetro de reporte (d3.api.domain.ReportParameterRequest)
      properties:
        parameter:
          type: string
        value:
          type: string

    DataFieldRequest:
      type: object
      description: Solicitud de datos de campo (d3.api.domain.DataFieldRequest)
      properties:
        template:
          type: string
        code:
          type: string
        preconditions:
          type: array
          items:
            $ref: '#/components/schemas/FieldRequest'
      required: [template, code]

    DataFieldResponse:
      type: object
      description: Respuesta de datos de campo (d3.api.domain.DataFieldResponse)
      properties:
        field:
          type: string
        value:
          type: string
        internalId:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'

    DataFieldWithLoginRequest:
      type: object
      description: Login + datos de campo (d3.api.domain.DataFieldWithLoginRequest)
      properties:
        login:
          $ref: '#/components/schemas/LoginRequest'
        field:
          $ref: '#/components/schemas/DataFieldRequest'
      required: [login, field]

    GoogleAuthRequest:
      type: object
      description: >
        Solicitud de autenticación Google (d3.authentication.domain — en desarrollo).
        NO existe endpoint implementado en Spring.
      properties:
        idToken:
          type: string
          description: id_token de Google
        urlServer:
          type: string

    # ==================== AUTH (d3.authentication.domain) ====================
    AutenticacionRequest:
      type: object
      description: >
        Filtro de autenticación (d3.authentication.domain.UsuarioAutenticacionFilterDTO).
        NOTA: El controller recibe este DTO, no un DTO simplificado.
      properties:
        usuario:
          type: string
        sesion:
          type: string
        clave:
          type: string
        claveAnterior:
          type: string
          description: Fecha de compilación (control de versión cliente)
        securityToken:
          type: string
        ip:
          type: string

    AutenticacionResponse:
      type: object
      description: >
        Respuesta de autenticación (d3.authentication.domain.UsuarioAutenticacionDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            usuario:
              type: string
            sesion:
              type: string
            clave:
              type: string
            usuarioNombre:
              type: string
            claveAnterior:
              type: string
            tableroControl:
              type: integer
            usuarioDTO:
              $ref: '#/components/schemas/UsuarioDTO'
            organizacion:
              type: object
              additionalProperties: true
            mensaje:
              type: string
            token:
              type: string
            fechaMaxima:
              type: string
              format: date-time
            ip:
              type: string
            autorizacionCrea:
              type: string
            autorizacionElimina:
              type: string
            fechaCreacion:
              type: string
              format: date-time

    CheckTokenRequest:
      type: object
      description: Request para checkToken
      properties:
        securityToken:
          type: string
        claveAnterior:
          type: string

    SolicitarClaveRequest:
      type: object
      description: Solicitud de nueva clave (d3.authentication.domain.UsuarioAutenticacionDTO simplificado)
      properties:
        usuario:
          type: string
        sesion:
          type: string
        clave:
          type: string
        ip:
          type: string

    # ==================== DOCUMENTS (d3.document.domain) ====================
    PedidoVentaDTO:
      type: object
      description: >
        Documento/expediente (d3.document.domain.PedidoVentaDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            fechaRegistro:
              type: string
              format: date-time
            fecha:
              type: string
              format: date-time
            funcionario:
              type: string
            funcionarioNombre:
              type: string
            plantilla:
              type: string
            consecutivo:
              type: number
              format: double
              description: BigDecimal en Java
            nombre:
              type: string
            imagen:
              type: string
            descripcion:
              type: string
            estadoExpediente:
              type: string
            textoFiltro:
              type: string
            estadoNombre:
              type: string
            historico:
              type: integer
            transaccion:
              type: string
            dinero:
              type: object
              additionalProperties: true
              description: PedidoVentaDineroDTO (pendiente de definición completa)
            caracteristicas:
              type: array
              items:
                type: object
                additionalProperties: true
              description: Lista de PedidoVentaCaracteristicaDTO
            campoOrigen:
              type: string
            campoPropiedad:
              type: string
            messages:
              type: array
              items:
                $ref: '#/components/schemas/DocumentMessage'

    PedidoVentaFilterDTO:
      type: object
      description: >
        Filtro de documentos (d3.document.domain.PedidoVentaFilterDTO).
        Hereda de BasicFilterDTO.
      allOf:
        - $ref: '#/components/schemas/BasicFilterDTO'
        - type: object
          properties:
            fechaRegistroMin:
              type: string
              format: date-time
            fechaRegistroMax:
              type: string
              format: date-time
            fechaMin:
              type: string
              format: date-time
            fechaMax:
              type: string
              format: date-time
            funcionario:
              type: string
            funcionarioNombre:
              type: string
            proceso:
              type: string
            plantilla:
              type: string
            nombre:
              type: string
            imagen:
              type: string
            descripcion:
              type: string
            estadoExpediente:
              type: string
            textoFiltro:
              type: string
            estadoNombre:
              type: string
            historico:
              type: integer
            transaccion:
              type: string
            caracteristicas:
              type: array
              items:
                type: object
                additionalProperties: true
            campoOrigen:
              type: string
            campoPropiedad:
              type: string
            filtersByFields:
              type: array
              items:
                type: object
                additionalProperties: true
              description: Lista de PedidoVentaCaracteristicaFilterDTO

    PedidoVentaAjusteDTO:
      type: object
      description: >
        Transición de estado (d3.document.domain.PedidoVentaAjusteDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            documento:
              type: string
            fecha:
              type: string
              format: date-time
            estadoInicial:
              type: string
            estadoFinal:
              type: string
            motivo:
              type: string
            responsable:
              type: string

    PedidoVentaCaracteristicaFilterDTO:
      type: object
      description: >
        Filtro de características (d3.document.domain.PedidoVentaCaracteristicaFilterDTO).
        Hereda de BasicFilterDTO.
      allOf:
        - $ref: '#/components/schemas/BasicFilterDTO'
        - type: object
          properties:
            documento:
              type: string
            campo:
              type: string
            valorText:
              type: string
            valorFechaMin:
              type: string
              format: date-time
            valorFechaMax:
              type: string
              format: date-time
            valorOpcion:
              type: string
            valorAuxiliar:
              type: string
            valorNumeroMin:
              type: number
              format: double
            valorNumeroMax:
              type: number
              format: double
            dependientes:
              type: array
              items:
                type: object
                additionalProperties: true
            expedientes:
              type: array
              items:
                $ref: '#/components/schemas/PedidoVentaDTO'
            mensaje:
              type: string
            transaccionRegistro:
              type: string
            transaccionInactivo:
              type: string

    # ==================== TASKS (d3.task.domain) ====================
    TaskDTO:
      type: object
      description: >
        Tarea (d3.task.domain.TaskDTO).
        Hereda de SharedDataObject (key, state).
      allOf:
        - $ref: '#/components/schemas/SharedDataObject'
        - type: object
          properties:
            user:
              type: string
            title:
              type: string
            notes:
              type: string
            completed:
              type: string
              format: date-time
            dueDate:
              type: string
              format: date-time
            priority:
              type: integer
            order:
              type: integer
            createdAt:
              type: string
              format: date-time

    TaskRequest:
      type: object
      description: Solicitud de creación/actualización de tarea (d3.task.domain.TaskRequest)
      properties:
        key:
          type: string
        user:
          type: string
        title:
          type: string
        notes:
          type: string
        completed:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        priority:
          type: integer
        order:
          type: integer
      required: [title]

    # ==================== ACCOUNTING (d3.accounting.domain) ====================
    VoucherDTO:
      type: object
      description: >
        Comprobante contable (d3.accounting.domain.VoucherDTO).
        Hereda de SharedDataObject (key, state).
      allOf:
        - $ref: '#/components/schemas/SharedDataObject'
        - type: object
          properties:
            catalog:
              type: string
            catalogCode:
              type: string
            code:
              type: string
            type:
              type: string
            concept:
              type: string
            factDate:
              type: string
              format: date-time
            value:
              type: number
              format: double
            document:
              type: string
            mainDocument:
              type: string
            deleteDate:
              type: string
              format: date-time
            creationDate:
              type: string
              format: date-time

    Voucher:
      type: object
      description: >
        Comprobante contable completo (d3.accounting.domain.Voucher).
        header + records.
      properties:
        header:
          $ref: '#/components/schemas/VoucherDTO'
        records:
          type: array
          items:
            $ref: '#/components/schemas/VoucherLine'

    VoucherLine:
      type: object
      description: Línea de comprobante (d3.accounting.domain.VoucherLine)
      properties:
        line:
          type: object
          additionalProperties: true
          description: AccountRecordDTO
        references:
          type: array
          items:
            type: object
            additionalProperties: true
            description: AccountRecordAuxiliarDTO

    VoucherRequest:
      type: object
      description: >
        Solicitud de comprobante API (d3.accounting.domain.VoucherRequest).
        Para endpoint /acc/api/voucher.
      properties:
        catalog:
          type: string
        concept:
          type: string
        factDate:
          type: string
          format: date-time
        value:
          type: number
          format: double
        document:
          type: string
        mainDocument:
          type: string
        type:
          type: string
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
            description: VoucherLineRequest

    VoucherPrepareRequest:
      type: object
      description: Solicitud de preparación de comprobante (d3.accounting.domain.VoucherPrepareRequest)
      properties:
        llaveTabla:
          type: string
        plantilla:
          type: string

    VoucherRangeRequest:
      type: object
      description: Solicitud de rango de comprobantes (d3.accounting.domain.VoucherRangeRequest)
      properties:
        llaveTabla:
          type: string
        plantilla:
          type: string

    ResultMapDTO:
      type: object
      description: Resultado de mapa/saldo (d3.accounting.domain.ResultMapDTO)
      properties:
        key:
          type: string
        value:
          type: string

    AccountDTO:
      type: object
      description: Cuenta contable (d3.accounting.domain.AccountDTO)
      properties:
        key:
          type: string
        nombre:
          type: string
        codigo:
          type: string
        tipo:
          type: string

    CatalogDTO:
      type: object
      description: Catálogo contable (d3.accounting.domain.CatalogDTO)
      properties:
        key:
          type: string
        nombre:
          type: string
        codigo:
          type: string

    # ==================== NOTIFICATIONS (d3.notification.domain) ====================
    ActividadDTO:
      type: object
      description: >
        Actividad/notificación (d3.notification.domain.ActividadDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            responsable:
              type: string
            responsableIdentificacion:
              type: string
            responsableNombre:
              type: string
            documento:
              type: string
            documentoDTO:
              $ref: '#/components/schemas/PedidoVentaDTO'
            responsableFoto:
              type: string
            comentario:
              type: string
            fechaArrancar:
              type: string
              format: date-time
            fechaRegistro:
              type: string
              format: date-time
            usuarioRegistro:
              type: string
            fechaInactivo:
              type: string
              format: date-time
            fechaTerminar:
              type: string
              format: date-time
            usuarioInactivo:
              type: string
            fechaLeido:
              type: string
              format: date-time

    # ==================== USERS (d3.users.domain) ====================
    UsuarioDTO:
      type: object
      description: >
        Usuario (d3.users.domain.UsuarioDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            identificacion:
              type: string
            nombre:
              type: string
            imagen:
              type: string
            rol:
              type: string
            documento:
              type: string
            productos:
              type: array
              items:
                type: object
                additionalProperties: true
            usuarioFiltroDependiente:
              type: string
            correo:
              type: string
            usuarioRol:
              type: string
            telefono:
              type: string

    UsuarioFilterDTO:
      type: object
      description: Filtro de usuarios (d3.users.domain.UsuarioFilterDTO)
      properties:
        nombre:
          type: string
        email:
          type: string
        rol:
          type: string
        estado:
          type: string
        documento:
          type: string

    RolAccesoDTO:
      type: object
      description: >
        Rol de acceso (d3.authorization.domain.RolAccesoDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            plantilla:
              type: string
            nombre:
              type: string
            codigo:
              type: string
            imagen:
              type: string

    # ==================== AUTHORIZATION ====================
    DfaRequest:
      type: object
      description: Solicitud de doble factor (d3.authentication.domain — campos de UsuarioAutenticacionDTO)
      properties:
        usuario:
          type: string
        token:
          type: string
      required: [usuario, token]

    # ==================== FE (d3.fe.domain) ====================
    FEResponse:
      type: object
      description: >
        Respuesta de facturación electrónica (d3.fe.domain.FEResponse).
        Se usa para sign, signNE, signWithZip, signNEWithZip y generateCU.
        Todos los campos son nullable (@JsonInclude(NON_NULL)).
      properties:
        result:
          type: string
          description: "Código de resultado ('200' = éxito, '400' = error)"
        error:
          type: string
        cufe:
          type: string
        xmlUrl:
          type: string
        zipUrl:
          type: string
        xml:
          type: string
        zipBase64:
          type: string
        digestValue:
          type: string
        signatureValue:
          type: string
        x509Certificate:
          type: string

    # ==================== MASSIVE LOAD (d3.massiveload.domain) ====================
    MassiveMasterRequest:
      type: object
      description: >
        Carga masiva master (d3.massiveload.domain.MassiveMasterRequest).
        NOTA: estado es READ_ONLY (@JsonProperty(access = READ_ONLY)).
      properties:
        key:
          type: string
        archivo:
          type: string
        fecha:
          type: string
          format: date-time
        mensaje:
          type: string
        plantilla:
          type: string
        progreso:
          type: string
        usuario:
          type: string
        estado:
          type: string
          readOnly: true
          description: Solo lectura

    MasivaItemRequest:
      type: object
      description: >
        Ítem de carga masiva (d3.massiveload.domain.MasivaItemRequest).
        Hereda de SharedDataObject (key, state).
      allOf:
        - $ref: '#/components/schemas/SharedDataObject'
        - type: object
          properties:
            carga:
              type: string
            documento:
              type: string
            fechaSerializacion:
              type: string
              format: date-time
            fechaSincronizacion:
              type: string
              format: date-time
            modelo:
              type: string
            nombre:
              type: string
            progreso:
              type: string
            createdAt:
              type: string
              format: date-time
            createdUser:
              type: string
            updatedAt:
              type: string
              format: date-time
            updatedUser:
              type: string
            state:
              type: string
              readOnly: true

    # ==================== CONFIG (d3.configuration.domain) ====================
    PropiedadDTO:
      type: object
      description: >
        Propiedad de configuración (d3.configuration.domain.PropiedadDTO).
        Hereda de BasicDTO (llaveTabla, estado).
      allOf:
        - $ref: '#/components/schemas/BasicDTO'
        - type: object
          properties:
            propiedadValor:
              type: string
            tipo:
              type: string
            nombre:
              type: string
            key:
              type: string
            campo:
              type: string
            valor:
              type: string
            texto:
              type: string
            rol:
              type: string
            rolNombre:
              type: string
            rolExcluyente:
              type: string
            rolExcluyenteNombre:
              type: string
            fechaInicial:
              type: string
              format: date-time
            fechaFinal:
              type: string
              format: date-time
            usuario:
              type: string
            usuarioNombre:
              type: string
            usuarioExcluyente:
              type: string
            usuarioExcluyenteNombre:
              type: string
            motivo:
              type: string
            bloqueo:
              type: string
            fechaDefinicion:
              type: string
              format: date-time
            fechaEliminacion:
              type: string
              format: date-time
            usuarioCreacion:
              type: string
            usuarioEliminacion:
              type: string
            relaciones:
              type: integer

    # ==================== TEMPLATES (d3.process.domain) ====================
    DocumentoPlantillaDTO:
      type: object
      description: Plantilla de documento (d3.process.domain.DocumentoPlantillaDTO)
      properties:
        llaveTabla:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        estado:
          type: string

    DocumentoRelacionGestorDTO:
      type: object
      description: Traza de relaciones (d3.document.domain.DocumentoRelacionGestorDTO)
      properties:
        llaveTabla:
          type: string
        documento:
          type: string
        gestionador:
          type: string
        transaccion:
          type: string

    # ==================== WEBSERVICE ====================
    WebServiceCopyRequest:
      type: object
      description: >
        El endpoint /template/designer/copy recibe @RequestParam processId.
        NO es un body con dos campos.
      properties:
        processId:
          type: string
      required: [processId]

  responses:
    Unauthorized:
      description: Token inválido, expirado o sesión cerrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedApiErrorResponse'
    BadRequest:
      description: Error de validación / regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedApiErrorResponse'

paths:
  # ==================== API EXTERNAL (ApiController: /api/*) ====================
  /api/login:
    post:
      operationId: loginApi
      tags: [api-external]
      summary: Login de API (user/password)
      security:
        - apiKeyAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/get:
    post:
      operationId: getDocumentsApi
      tags: [api-external]
      summary: Listar documentos por filtro
      description: >
        Requiere AMBOS headers: x-api-key (apiKeyAuth) Y Authorization (bearerAuth).
      security:
        - apiKeyAuth: []
          bearerAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFilterRequest'
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/send:
    post:
      operationId: sendDocumentApi
      tags: [api-external]
      summary: Crear o actualizar documento
      description: Requiere AMBOS headers x-api-key Y Authorization.
      security:
        - apiKeyAuth: []
          bearerAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequest'
      responses:
        '200':
          description: Resultado de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/getReport:
    post:
      operationId: getReportApi
      tags: [api-external]
      summary: Generar reporte
      description:  Requiere AMBOS headers x-api-key Y Authorization.
      security:
        - apiKeyAuth: []
          bearerAuth: []
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedIdResponse'

  /api/getWithLogin:
    post:
      operationId: getWithLoginApi
